<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
.card{background:#1a1a1a;padding:40px;border-radius:10px;border:1px solid #00ff88;width:350px}
input,button{width:100%;padding:12px;margin:10px 0;border-radius:5px;border:none}
input{background:#2a2a2a;color:#fff}
button{background:#00ff88;color:#000;font-weight:bold;cursor:pointer;font-size:16px}
a{color:#00ff88;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <h2>Login</h2>
  <input type="tel" id="phone" placeholder="Phone Number" required>
  <input type="password" id="password" placeholder="Password" required>
  <button onclick="login()">Login</button>
  <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
</div>

<script type="module">
import { auth, signInWithEmailAndPassword } from './firebase.js';

window.login = async function(){
  const phone = document.getElementById('phone').value;
  const password = document.getElementById('password').value;
  
  const fakeEmail = phone + "@growmore.app"
  
  try{
    await signInWithEmailAndPassword(auth, fakeEmail, password);
    alert('Login successful!');
    window.location.href = 'dashboard.html';
  } catch(e){
    alert(e.message);
  }
}
</script>
</body>
                              </html>
