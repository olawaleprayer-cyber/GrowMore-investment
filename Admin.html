<!DOCTYPE html>
<html>
<head>
<title>Admin Login - GROWMORE</title>
<style>
body{background:#0a0a0a;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:Arial} 
.box{background:#1a1a1a;padding:40px;border-radius:10px;border:2px solid #00ff88;width:350px} 
input{width:100%;padding:12px;margin:10px 0;background:#2a2a2a;border:none;color:#fff;border-radius:5px;box-sizing:border-box} 
.btn{background:#00ff88;color:#000;padding:12px;width:100%;border:none;border-radius:5px;cursor:pointer;font-weight:bold;font-size:16px}
h2{text-align:center;color:#00ff88}
</style>
</head>
<body>
<div class="box">
  <h2>Admin Login</h2>
  <input type="email" id="adminEmail" placeholder="Email">
  <input type="password" id="adminPass" placeholder="Password">
  <button class="btn" onclick="login()">Login</button>
</div>

<script type="module">
  import { auth, signInWithEmailAndPassword } from './firebase.js';
  function login(){
    let email = document.getElementById('adminEmail').value;
    let pass = document.getElementById('adminPass').value;
    signInWithEmailAndPassword(auth, email, pass)
    .then(()=> window.location = 'dashboard.html')
    .catch(err=> alert(err.message));
  }
  window.login = login;
</script>
</body>
</html>
