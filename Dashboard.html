<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard - GROWMORE</title>
<style>
body{background:#0a0a0a;color:#fff;padding:20px;font-family:Arial;margin:0} 
h1{color:#00ff88} 
table{width:100%;border-collapse:collapse;margin-top:20px} 
th,td{border:1px solid #00ff88;padding:12px;text-align:left} 
th{background:#00ff88;color:#000} 
.btn{background:#00ff88;color:#000;padding:8px 15px;border:none;border-radius:5px;cursor:pointer;font-weight:bold} 
.header{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="header">
<h1>Admin Dashboard</h1>
<button class="btn" onclick="logout()">Logout</button>
</div>

<h2>Investors</h2>
<table id="investorsTable">
<tr><th>Name</th><th>Email</th><th>Amount</th><th>Status</th><th>Action</th></tr>
</table>

<script type="module">
  import { auth, db, signOut, onAuthStateChanged, collection, onSnapshot, doc, updateDoc } from './firebase.js';
  
  onAuthStateChanged(auth, user => { 
    if(!user) window.location = 'admin.html' 
  });
  
  const q = collection(db, "investors");
  onSnapshot(q, (snapshot) => {
    let table = document.getElementById('investorsTable');
    table.innerHTML = '<tr><th>Name</th><th>Email</th><th>Amount</th><th>Status</th><th>Action</th></tr>';
    snapshot.forEach(docSnap => {
      let d = docSnap.data();
      table.innerHTML += `<tr><td>${d.name}</td><td>${d.email}</td><td>₦${d.amount}</td><td>${d.status}</td><td><button class="btn" onclick="approve('${docSnap.id}')">Approve</button></td></tr>`
    });
  });
  
  window.approve = (id) => updateDoc(doc(db, "investors", id), {status: "Active"});
  window.logout = () => signOut(auth).then(()=> window.location = 'admin.html');
</script>
</body>
</html>
