<!DOCTYPE html>
<html>
<head>
<title>Dashboard - GrowMore</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0}
.header{background:#1a1a1a;padding:15px 30px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #00ff88}
.balance-card{background:linear-gradient(135deg,#00ff88,#00cc6a);color:#000;padding:25px;border-radius:12px;margin:20px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;padding:20px}
.card{background:#1a1a1a;padding:20px;border-radius:10px;border:1px solid #333}
.btn{background:#00ff88;color:#000;border:none;padding:12px 20px;border-radius:5px;cursor:pointer;font-weight:bold;width:100%;margin-top:10px}
</style>
</head>
<body>
<div class="header">
  <h2>GrowMore Mining</h2>
  <button class="btn" onclick="logout()" style="width:auto">Logout</button>
</div>

<div class="balance-card">
  <p>Account Balance</p>
  <h1 id="balance">$0.00</h1>
  <button class="btn" onclick="window.location='deposit.html'">Deposit</button>
  <button class="btn" style="background:#333;color:#fff" onclick="window.location='withdraw.html'">Withdraw</button>
</div>

<div class="grid">
  <div class="card">
    <h3>👤 Profile</h3>
    <p>Name: <span id="userName">Loading...</span></p>
    <p>Phone: <span id="userPhone">Loading...</span></p>
  </div>
  <div class="card">
    <h3>📈 Active Investment</h3>
    <p id="activePlan">No active plan</p>
  </div>
  <div class="card">
    <h3>🎁 Referrals</h3>
    <p>Code: <span id="userReferral">None</span></p>
  </div>
</div>
